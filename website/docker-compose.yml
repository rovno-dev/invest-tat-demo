services:
  next-js:
    container_name: next-js
    profiles: [ "prod" ]
    build:
      context: .
      target: prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.next-js.comle=PathPrefix(`/`)"
      - "traefik.http.services.next-js.loadbalancer.server.port=3000"
      - "traefik.http.routers.next-js.entrypoints=websecure"
      - "traefik.http.routers.next-js.tls.certresolver=myresolver"

networks:
  main-network:
    external: true